[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-intelligence-assistant"
version = "0.1.0"
description = "Evaluated contract clause retrieval for LegalBench-RAG CUAD-mini"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "rank-bm25>=0.2.2",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
test = ["pytest>=8.0"]

[project.scripts]
contract-assistant = "src.cli:app"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
